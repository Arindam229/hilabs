[project]
name = "hilabs-provider-rates"
version = "0.1.0"
description = "Streaming Centene provider-rate curation pipeline"
requires-python = ">=3.11"
dependencies = [
  "ijson>=3.3",
  "openpyxl>=3.1",
  "pandas>=2.2",
  "pyarrow>=17",
  "pyyaml>=6",
  "sentence-transformers>=6.1.0",
  "usaddress>=0.5",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests", "api/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["api"]
