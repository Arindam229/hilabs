  # which blocks scripted access from this network). Override with a standalone file via
  # PTD_REVALIDATION_ZIP / PTD_MEDICARE_PROVIDER_ZIP / PTD_PECOS_ENROLLMENT_ZIP.
  revalidation_member: cms/Revalidation Reassignment List.zip
  medicare_provider_member: cms/Medicare Physician & Other Practitioners - by Provider.zip
  pecos_enrollment_member: cms/Medicare Fee-For-Service Public Provider Enrollment.zip
